<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Illustration of precast compound wall panels: made at a precast plant, delivered by truck and installed between columns">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#0B3A66" stroke-opacity=".07"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEAF8"/><stop offset="1" stop-color="#F4F8FD"/></linearGradient>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#CFE0F2"/><circle cx="2" cy="2" r=".9" fill="#0B3A66" opacity=".18"/><circle cx="6" cy="5" r=".7" fill="#0B3A66" opacity=".14"/></pattern>
  </defs>
  <rect width="400" height="500" fill="url(#sky)"/>
  <rect width="400" height="500" fill="url(#g)"/>

  <!-- precast plant shed -->
  <polygon points="22,170 112,128 202,170" fill="#1565C0"/>
  <rect x="30" y="170" width="164" height="96" fill="#0B3A66"/>
  <rect x="44" y="186" width="136" height="22" rx="3" fill="#EB9723"/>
  <text x="112" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#0B3A66">PRECAST PLANT</text>
  <rect x="78" y="222" width="68" height="44" fill="#1565C0"/>
  <g fill="url(#conc)" stroke="#0B3A66" stroke-width="1"><rect x="86" y="236" width="52" height="7"/><rect x="86" y="245" width="52" height="7"/><rect x="86" y="254" width="52" height="7"/></g>

  <!-- truck carrying panels -->
  <g>
    <rect x="214" y="222" width="112" height="12" fill="#0B3A66"/>
    <g fill="url(#conc)" stroke="#0B3A66" stroke-width="1"><rect x="220" y="196" width="100" height="8"/><rect x="220" y="205" width="100" height="8"/><rect x="220" y="214" width="100" height="8"/></g>
    <path d="M326 196h30l18 22v16h-48z" fill="#EB9723"/>
    <path d="M334 202h18l11 14h-29z" fill="#DCEAF8"/>
    <circle cx="240" cy="240" r="10" fill="#0B3A66"/><circle cx="240" cy="240" r="4" fill="#DCEAF8"/>
    <circle cx="300" cy="240" r="10" fill="#0B3A66"/><circle cx="300" cy="240" r="4" fill="#DCEAF8"/>
    <circle cx="352" cy="240" r="10" fill="#0B3A66"/><circle cx="352" cy="240" r="4" fill="#DCEAF8"/>
  </g>
  <path d="M30 266H200M214 250H392" stroke="#0B3A66" stroke-opacity=".25" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- compound wall being installed -->
  <g fill="#0B3A66">
    <rect x="30" y="300" width="12" height="110"/><rect x="118" y="300" width="12" height="110"/><rect x="206" y="300" width="12" height="110"/><rect x="294" y="300" width="12" height="110"/>
  </g>
  <g fill="url(#conc)" stroke="#0B3A66" stroke-width="1.2">
    <rect x="42" y="384" width="76" height="24"/><rect x="42" y="358" width="76" height="24"/><rect x="42" y="332" width="76" height="24"/><rect x="42" y="306" width="76" height="24"/>
    <rect x="130" y="384" width="76" height="24"/><rect x="130" y="358" width="76" height="24"/><rect x="130" y="332" width="76" height="24"/><rect x="130" y="306" width="76" height="24"/>
    <rect x="218" y="384" width="76" height="24"/><rect x="218" y="358" width="76" height="24"/>
  </g>
  <!-- panel being lifted -->
  <path d="M256 282V330" stroke="#0B3A66" stroke-width="2"/>
  <path d="M236 330L256 312L276 330" stroke="#0B3A66" stroke-width="1.5" fill="none"/>
  <rect x="218" y="330" width="76" height="24" fill="url(#conc)" stroke="#EB9723" stroke-width="2.5"/>
  <path d="M256 282L380 270" stroke="#EB9723" stroke-width="6" stroke-linecap="round"/>
  <rect x="362" y="270" width="26" height="140" fill="#EB9723" opacity=".0"/>
  <path d="M380 270V410" stroke="#EB9723" stroke-width="8"/>
  <rect x="366" y="392" width="30" height="18" fill="#0B3A66"/>
  <!-- check badge -->
  <circle cx="340" cy="330" r="22" fill="#0B3A66"/>
  <path d="M330 330l7 7 13-14" stroke="#EB9723" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ground -->
  <rect y="410" width="400" height="90" fill="#0B3A66"/>
  <rect y="410" width="400" height="6" fill="#EB9723"/>
  <g stroke="#DCEAF8" stroke-opacity=".35" stroke-width="2"><path d="M0 446H400M0 474H400"/></g>
  <text x="24" y="458" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#DCEAF8">PRECAST COMPOUND WALL</text>
  <rect x="24" y="466" width="120" height="6" rx="3" fill="#1565C0"/>
  <rect x="24" y="466" width="108" height="6" rx="3" fill="#EB9723"/>
  <text x="152" y="473" font-family="Arial, sans-serif" font-size="11" fill="#DCEAF8">MADE IN OUR OWN PLANT</text>
</svg>
